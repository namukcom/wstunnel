
name: Build Windows GNU

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wstunnel-windows-release
  cancel-in-progress: false

jobs:
  build:
    name: Build wstunnel Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Get latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/erebe/wstunnel/releases/latest \
            --jq '.tag_name')

          test -n "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream release: $TAG"

      - name: Checkout upstream release
        uses: actions/checkout@v4
        with:
          repository: erebe/wstunnel
          ref: ${{ steps.upstream.outputs.tag }}
          persist-credentials: false

      - name: Get package version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "wstunnel-cli") | .version')

          test -n "$VERSION"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Package version: $VERSION"

      - name: Install MinGW
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install Rust target
        run: |
          rustup toolchain install 1.100.0 \
            --profile minimal \
            --target x86_64-pc-windows-gnu

      - name: Build
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          cargo +1.100.0 build \
            --release \
            --package wstunnel-cli \
            --target x86_64-pc-windows-gnu

      - name: Prepare artifacts
        run: |
          mkdir -p dist

          cp target/x86_64-pc-windows-gnu/release/wstunnel.exe dist/

          cd dist
          sha256sum wstunnel.exe > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-v${{ env.VERSION }}-windows-gnu
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          TAG="custom-v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping."
            exit 0
          fi

          gh release create "$TAG" \
            dist/wstunnel.exe \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "wstunnel v${VERSION} (Windows GNU)" \
            --notes "Self-compiled from upstream ${UPSTREAM_TAG}.

          Build environment:
          - Runner: Ubuntu 24.04
          - Rust: 1.100.0
          - Target: x86_64-pc-windows-gnu
          - Profile: release

          SHA256 checksum is included in SHA256SUMS.txt."
